extends: ../default.yaml
experiment:
  name: moe_early_cycle
  result_set: ablation
  branch: cycle_effect
  description: Metadata-routed CCV early-cycle comparison.
  cache_name: moe_early_cycle
  cycle_required_frames: [overall_summary_df, dataset_summary_df, overall_delta_summary_df, dataset_delta_summary_df]
  models:
    - name: CCV-basic
      key: ccv_basic
      input_mode: abs
      family: ccvnet
      plot_group: major
      max_epochs: 220
      patience: 30
      cache_name: ccv_basic_abs
      notes: Main CCV model for the metadata-routed early-cycle comparison.
    - name: CCV-meta-MoE
      key: ccv_meta_moe
      input_mode: abs
      family: ccvnet
      plot_group: major
      max_epochs: 220
      patience: 30
      cache_name: ccv_meta_moe_abs
      notes: Metadata-routed mixture-of-experts variant in the early-cycle comparison.
    - name: CCV-meta-MoLE
      key: ccv_meta_mole
      input_mode: abs
      family: ccvnet
      plot_group: major
      max_epochs: 220
      patience: 30
      cache_name: ccv_meta_mole_abs
      notes: Metadata-routed linear-expert variant in the early-cycle comparison.
